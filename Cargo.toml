[package]
name = "owl-mcp"
version = "1.0.16"
edition = "2021"
rust-version = "1.88"
description = "High-performance MCP server for OWL ontology management, written in Rust"
authors = ["Antonio Zaitoun <antonio@zaitoun.dev>"]
license = "MIT"
repository = "https://github.com/Minitour/owl-mcp"
homepage = "https://github.com/Minitour/owl-mcp"

[[bin]]
name = "owl-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
horned-owl = "1.4"
whelk = { git = "https://github.com/INCATools/whelk-rs" }
oxigraph = { version = "0.5", default-features = false }
curie = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile = "3"
